name: Playwright Local Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  NODE_VERSION: '18'

jobs:
  test:
    name: Run Playwright Tests Locally
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      
      - name: Run linting
        run: npm run lint
      
      - name: Run Playwright tests
        env:
          BASE_URL: https://demo.nopcommerce.com
          CI: true
        run: npm test
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 30
      
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: test-results/junit.xml
      
      - name: Publish test results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Playwright Test Results
          path: test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

  deploy-report:
    name: Deploy Report to GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'pull_request'
    permissions:
      contents: write
    
    steps:
      - name: Download HTML report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: reports/${{ github.run_number }}
          keep_files: true
      
      - name: Create index page
        run: |
          mkdir -p public
          cat > public/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <title>Playwright Test Reports</title>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <style>
              body { font-family: system-ui; max-width: 1200px; margin: 2rem auto; padding: 0 1rem; }
              h1 { color: #2563eb; }
              .report { padding: 1rem; margin: 1rem 0; border: 1px solid #e5e7eb; border-radius: 0.5rem; }
              .report:hover { background: #f9fafb; }
              a { color: #2563eb; text-decoration: none; font-weight: 500; }
              a:hover { text-decoration: underline; }
              .meta { color: #6b7280; font-size: 0.875rem; }
            </style>
          </head>
          <body>
            <h1>🎭 Playwright Test Reports</h1>
            <div class="report">
              <a href="./reports/${{ github.run_number }}/index.html">Latest Report - Run #${{ github.run_number }}</a>
              <div class="meta">Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}</div>
            </div>
          </body>
          </html>
          EOF
      
      - name: Deploy index page
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true

